<!DOCTYPE html>
<html>
<head>
  <title>Melo Giveaway</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ff7a00, #ff4d00);
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    h1 {
      font-size: 48px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .sub {
      opacity: 0.9;
      margin-bottom: 10px;
    }

    .rules {
      font-size: 14px;
      opacity: 0.85;
      margin-bottom: 15px;
    }

    .prize-label {
      font-weight: 600;
      margin-bottom: 8px;
    }

    .prize {
      width: 260px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    #stats {
      margin-bottom: 15px;
      font-size: 15px;
      opacity: 0.9;
    }

    button {
      padding: 16px 36px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: #ff4d00;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #winner {
      margin-top: 30px;
      font-size: 40px;
      font-weight: bold;
      background: rgba(0,0,0,0.25);
      padding: 20px 30px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      min-width: 300px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎉 MELO GIVEAWAY</h1>
  <div class="sub">Entries pulled live from Melo users & listings</div>

  <div class="rules">
    1 entry per account • +5 per listing
  </div>

  <div class="prize-label">🎁 Full Precision Set Giveaway</div>
  <img src="/giveaway-prize.jpg" class="prize" />

  <div id="stats"></div>

  <button onclick="pickWinner()">Pick Winner</button>

  <div id="winner"></div>

</div>

<script>
async function pickWinner() {
  const stats = document.getElementById("stats")
  const winnerDiv = document.getElementById("winner")

  winnerDiv.innerText = "Loading..."
  
  const res = await fetch("https://ccrrxdpfepsoghtgtpwx.supabase.co/functions/v1/giveaway")
  const data = await res.json()

  // 🔥 REMOVE YOU
  const filtered = data.filter(user =>
  user.name !== "Brandon Hoffman" &&
  user.name !== "Melo669027796"
)

  let pool = []

  filtered.forEach(user => {
    for (let i = 0; i < user.entries; i++) {
      pool.push(user.name)
    }
  })

  // 🔥 ENTRY COUNTER
  stats.innerText = `Loaded ${filtered.length} users • ${pool.length} total entries`

  let spins = 60

  const interval = setInterval(() => {
    const random = pool[Math.floor(Math.random() * pool.length)]
    winnerDiv.innerText = random
    spins--

    if (spins <= 0) {
      clearInterval(interval)

      const final = pool[Math.floor(Math.random() * pool.length)]
      winnerDiv.innerText = "🎉 " + final
    }
  }, 60)
}
</script>

</body>
</html>
