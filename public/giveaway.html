<!DOCTYPE html>
<html>
<head>
  <title>Melo Giveaway</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.22), transparent 28%),
        linear-gradient(135deg, #ff8a1f, #d97732 45%, #ff4d00);
      overflow-x: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 60px;
      text-align: center;
    }

    h1 {
      font-size: clamp(38px, 7vw, 72px);
      font-weight: 900;
      margin: 12px 0 8px;
      letter-spacing: 1px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .sub {
      font-size: 16px;
      opacity: 0.92;
      margin-bottom: 8px;
    }

    .rules {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 18px;
    }

    .hero-card {
      background: rgba(0,0,0,0.18);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.25);
      backdrop-filter: blur(14px);
    }

    .prize-label {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .prize {
      width: min(360px, 92%);
      border-radius: 22px;
      box-shadow: 0 24px 65px rgba(0,0,0,0.38);
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 20px auto 16px;
      max-width: 520px;
    }

    .stat {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.14);
    }

    .stat-number {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
    }

    .stat-label {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.88;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      padding: 15px 28px;
      font-size: 16px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 900;
      transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    }

    button:hover {
      transform: scale(1.045);
    }

    .pick-btn {
      background: white;
      color: #d97732;
      box-shadow: 0 14px 34px rgba(0,0,0,0.24);
    }

    .entry-btn {
      background: rgba(0,0,0,0.22);
      color: white;
      border: 1px solid rgba(255,255,255,0.28);
    }

    #winner {
      margin: 26px auto 0;
      max-width: 680px;
      min-height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(30px, 6vw, 56px);
      font-weight: 900;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 22px 26px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 55px rgba(255,255,255,0.20);
      word-break: break-word;
    }

    .winner-pop {
      animation: winnerPop 0.75s ease-out;
    }

    @keyframes winnerPop {
      0% { transform: scale(0.72); opacity: 0; }
      60% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }

    .entries-panel {
      display: none;
      max-width: 720px;
      margin: 22px auto 0;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      overflow: hidden;
      text-align: left;
      backdrop-filter: blur(12px);
    }

    .entries-header {
      padding: 14px 16px;
      font-weight: 900;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .entries-list {
      max-height: 280px;
      overflow-y: auto;
      padding: 10px;
    }

    .entry-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 14px;
      background: rgba(255,255,255,0.13);
    }

    .entry-name {
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .entry-count {
      font-weight: 900;
      background: white;
      color: #d97732;
      border-radius: 999px;
      padding: 6px 10px;
      white-space: nowrap;
      font-size: 13px;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 560px) {
      .stats { grid-template-columns: 1fr; }
      .hero-card { padding: 16px; }
      button { width: 100%; }
    }
  </style>
</head>

<body>
<canvas id="confetti"></canvas>

<div class="wrap">
  <h1>🎉 MELO GIVEAWAY</h1>
  <div class="sub">Entries pulled live from Melo users & listings</div>
  <div class="rules">1 entry per account • +5 entries per listing</div>

  <div class="hero-card">
    <div class="prize-label">🎁 Full Precision Set Giveaway</div>
    <img src="/giveaway-prize.jpg" class="prize" />

    <div class="stats">
      <div class="stat">
        <div id="participants" class="stat-number">0</div>
        <div class="stat-label">Total Participants</div>
      </div>

      <div class="stat">
        <div id="entries" class="stat-number">0</div>
        <div class="stat-label">Total Entries</div>
      </div>
    </div>

    <div class="actions">
      <button class="pick-btn" onclick="pickWinner()">Pick Winner</button>
      <button class="entry-btn" onclick="toggleEntries()">View All Entries</button>
    </div>

    <div id="winner">Ready to pick 🎯</div>

    <div id="entriesPanel" class="entries-panel">
      <div class="entries-header">
        <span>All Giveaway Entries</span>
        <span id="entrySummary"></span>
      </div>
      <div id="entriesList" class="entries-list"></div>
    </div>
  </div>
</div>

<script>
const GIVEAWAY_URL = "https://ccrrxdpfepsoghtgtpwx.supabase.co/functions/v1/giveaway"
const BLOCKED_USERS = ["Brandon Hoffman", "Melo669027796"]

let giveawayData = []
let weightedPool = []
let loaded = false

async function loadEntries() {
  const res = await fetch(GIVEAWAY_URL)
  const data = await res.json()

  giveawayData = data
    .filter(user => user && user.name && !BLOCKED_USERS.includes(user.name))
    .map(user => ({
      name: user.name,
      entries: Number(user.entries || 0)
    }))
    .filter(user => user.entries > 0)
    .sort((a, b) => b.entries - a.entries)

  weightedPool = []

  giveawayData.forEach(user => {
    for (let i = 0; i < user.entries; i++) {
      weightedPool.push(user.name)
    }
  })

  animateNumber("participants", giveawayData.length)
  animateNumber("entries", weightedPool.length)
  renderEntriesList()

  loaded = true
}

function animateNumber(id, target) {
  const el = document.getElementById(id)
  let current = 0
  const step = Math.max(1, Math.ceil(target / 45))

  const timer = setInterval(() => {
    current += step
    if (current >= target) {
      current = target
      clearInterval(timer)
    }
    el.innerText = current.toLocaleString()
  }, 18)
}

function renderEntriesList() {
  const list = document.getElementById("entriesList")
  const summary = document.getElementById("entrySummary")

  summary.innerText = `${giveawayData.length} users • ${weightedPool.length.toLocaleString()} entries`

  list.innerHTML = giveawayData.map(user => `
    <div class="entry-row">
      <div class="entry-name">${escapeHtml(user.name)}</div>
      <div class="entry-count">${user.entries} entries</div>
    </div>
  `).join("")
}

function toggleEntries() {
  const panel = document.getElementById("entriesPanel")
  panel.style.display = panel.style.display === "block" ? "none" : "block"
}

async function pickWinner() {
  const winnerDiv = document.getElementById("winner")
  winnerDiv.classList.remove("winner-pop")

  if (!loaded) {
    winnerDiv.innerText = "Loading entries..."
    await loadEntries()
  }

  if (!weightedPool.length) {
    winnerDiv.innerText = "No entries found"
    return
  }

  let spins = 0
  const totalSpins = 75

  function spin() {
    const random = weightedPool[Math.floor(Math.random() * weightedPool.length)]
    winnerDiv.innerText = random

    spins++

    if (spins < totalSpins) {
      const delay = 25 + Math.pow(spins / totalSpins, 3) * 180
      setTimeout(spin, delay)
    } else {
      const finalWinner = weightedPool[Math.floor(Math.random() * weightedPool.length)]
      winnerDiv.innerText = "🎉 " + finalWinner
      winnerDiv.classList.add("winner-pop")
      launchConfetti()
    }
  }

  spin()
}

function launchConfetti() {
  const canvas = document.getElementById("confetti")
  const ctx = canvas.getContext("2d")
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight

  const pieces = []
  const colors = ["#ffffff", "#ffd166", "#ffb703", "#fb8500", "#fefae0"]

  for (let i = 0; i < 220; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height,
      size: 6 + Math.random() * 9,
      speed: 3 + Math.random() * 6,
      angle: Math.random() * Math.PI * 2,
      spin: Math.random() * 0.2,
      color: colors[Math.floor(Math.random() * colors.length)]
    })
  }

  let frame = 0

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)

    pieces.forEach(p => {
      p.y += p.speed
      p.x += Math.sin(p.angle) * 2
      p.angle += p.spin

      ctx.save()
      ctx.translate(p.x, p.y)
      ctx.rotate(p.angle)
      ctx.fillStyle = p.color
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65)
      ctx.restore()
    })

    frame++

    if (frame < 180) {
      requestAnimationFrame(draw)
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
    }
  }

  draw()
}

function escapeHtml(text) {
  const div = document.createElement("div")
  div.innerText = text
  return div.innerHTML
}

loadEntries()
</script>
</body>
</html>
